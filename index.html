<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JANG SEONG JU - DevOps · Backend · Frontend · ML 포트폴리오" />
    <title>SungJu · Portfolio</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ksec-theme')
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
          var p = localStorage.getItem('ksec-perf')
          if (p === 'on' || p === 'off') {
            document.documentElement.setAttribute('data-performance', p)
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
