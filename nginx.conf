# v2.velog.io는 AWS IP를 빠르게 회전한다(정상 DNS TTL ~34s).
# IP를 고정하면 옛 IP가 죽을 때 재발하므로, resolver로 항상 최신 DNS IP를 조회하고
# 짧은 커넥트 타임아웃 + 폴오버로 죽은 IP는 빠르게 건너뛴다.
# 서버->velog 인프라(AWS ap-northeast-2) 경로가 잠시 막히는 상황까지 견디도록
# v2.velog.io(주) + velog.io(백업)을 폴백 대상으로 두고, 매 요청마다 최신 DNS를 조회한다.

upstream velog_api {
    server v2.velog.io:443 resolve;
    server velog.io:443 resolve backup;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
    }

    location /velog-api {
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        resolver_timeout 3s;
        proxy_pass https://velog_api/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 4;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
