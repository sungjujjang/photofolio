# v2.velog.io의 유효 IP를 고정해 낡은 DNS 결과(3.37.x.x) 연결 문제를 우회.
# velog가 AWS IP를 회전하므로, velog 쪽 DNS가 바뀌면 여기 IP를 갱신해주세요.
upstream velog_api {
    server 13.209.60.217:443;
    server 13.124.176.214:443;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
    }

    location /velog-api {
        proxy_pass https://velog_api/graphql;
        proxy_set_header Host v2.velog.io;
        proxy_ssl_server_name on;
        proxy_ssl_name v2.velog.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
